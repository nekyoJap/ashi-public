<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>飛びつきチャンネル | 飛びつきが起きそうなレースを探す</title>
<meta name="description" content="単騎の選手が他ラインの番手に飛びつきそうなレースを、並び・脚質・競走得点から抽出して一覧表示します。" />
<link rel="stylesheet" href="assets/keirin-ui.css" />
<style>
  /* ===== ヒーロー ===== */
  .ch-hero {
    position: relative;
    color: #fff;
    background:
      radial-gradient(120% 140% at 88% 0%, rgba(215, 0, 46, .55) 0%, rgba(215, 0, 46, 0) 55%),
      linear-gradient(135deg, #16355e 0%, #0e2544 55%, #091a30 100%);
    overflow: hidden;
  }
  .ch-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      -60deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 9px);
    pointer-events: none;
  }
  .ch-hero__inner {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 16px;
    align-items: center;
    padding-top: 20px;
    padding-bottom: 20px;
  }
  .ch-hero__mark {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 62px;
    height: 62px;
    border-radius: 16px;
    background: linear-gradient(140deg, #e4103c, #a80024);
    box-shadow: 0 6px 18px rgba(215, 0, 46, .4), 0 1px 0 rgba(255, 255, 255, .3) inset;
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
  }
  .ch-hero__kicker {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .22em;
    color: #ffc7d3;
  }
  .ch-hero__title {
    margin: 2px 0 4px;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: .03em;
    line-height: 1.15;
  }
  .ch-hero__lead { margin: 0; font-size: 12.5px; color: #c3d3e6; line-height: 1.6; }
  .ch-hero__meta { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }
  .ch-stat {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .16);
    font-size: 11px;
    color: #d7e3f1;
    font-weight: 700;
  }
  .ch-stat b { font-family: var(--font-num); font-size: 14px; color: #fff; }

  /* ===== 固定ツールバー ===== */
  .ch-sticky {
    position: sticky;
    top: var(--header-h);
    z-index: 30;
    background: rgba(238, 241, 245, .95);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
  }
  .ch-sticky .chips { margin-top: 8px; }
  .date-nav { display: inline-flex; align-items: center; gap: 6px; }

  /* ===== 飛びつき度 ===== */
  .tb-rank {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
  }
  .tb-rank b { font-family: var(--font-num); font-size: 14px; }
  .tb-rank--s { background: linear-gradient(140deg, #e4103c, #a80024); }

  /* ===== 飛びつき図 ===== */
  .tb-move {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #fff6f8;
    border: 1px solid #f3c9d4;
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
  }
  .tb-move:last-of-type { margin-bottom: 0; }
  .tb-move__who { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; }
  .tb-cmt {
    flex: 1 1 260px;
    min-width: 0;
    font-size: 12px;
    line-height: 1.65;
    color: var(--ink-2);
    font-weight: 400;
  }

  .tb-none { padding: 18px 12px; text-align: center; color: var(--ink-3); font-size: 12.5px; font-weight: 700; }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="ch-hero">
  <div class="wrap wrap--wide ch-hero__inner">
    <div class="ch-hero__mark">飛</div>
    <div>
      <div class="ch-hero__kicker">TOBITSUKI RADAR</div>
      <h1 class="ch-hero__title">飛びつきチャンネル</h1>
      <p class="ch-hero__lead">
        コメントに「自力自在」「自在」がある選手を飛びつき候補として拾い、該当レースを抽出します。
      </p>
      <div class="ch-hero__meta" id="heroMeta"></div>
    </div>
  </div>
</div>

<div class="ch-sticky">
  <div class="wrap wrap--wide">
    <div class="toolbar">
      <span class="field">
        日付
        <span class="date-nav">
          <button class="btn btn--sm" id="prevDay" type="button">‹ 前日</button>
          <input class="input" id="dateInput" type="date" />
          <button class="btn btn--sm" id="nextDay" type="button">翌日 ›</button>
        </span>
      </span>
      <span class="badge badge--navy" id="dateLabel"></span>
      <span class="field">
        表示
        <select class="input" id="filterMode">
          <option value="hit" selected>候補ありのみ</option>
          <option value="all">すべてのレース</option>
        </select>
      </span>
      <span class="section-head__tail">
        <a class="btn btn--sm btn--navy" id="raceLink" href="race.html">出走表を見る</a>
      </span>
    </div>
    <div class="chips" id="dayChips"></div>
  </div>
</div>

<main class="wrap wrap--wide" style="padding-top:14px;">
  <div id="loadState" class="state">読み込み中…</div>
  <div id="content" hidden></div>
</main>

<div id="siteFooter"></div>

<script src="assets/keirin-ui.js"></script>
<script>
(function () {
  'use strict';

  const esc = KUI.esc;
  const state = { date: '', days: [], dayIndex: 0, filterMode: 'hit' };

  const el = {
    dateInput: document.getElementById('dateInput'),
    dateLabel: document.getElementById('dateLabel'),
    prevDay:   document.getElementById('prevDay'),
    nextDay:   document.getElementById('nextDay'),
    dayChips:  document.getElementById('dayChips'),
    filterMode: document.getElementById('filterMode'),
    heroMeta:  document.getElementById('heroMeta'),
    loadState: document.getElementById('loadState'),
    content:   document.getElementById('content'),
    raceLink:  document.getElementById('raceLink')
  };

  const currentDay = () => state.days[state.dayIndex];

  /* =========================================================
     飛びつき判定（暫定）

     飛びつき = 自分のラインを持たない選手が、他ラインの番手に
     飛びついてその位置を奪う戦法。

     本来の判定ロジックは後日差し替える。現状は暫定として、
     コメントに「自力自在」または「自在」を含む選手を
     飛びつき候補として拾う。

     差し替えるときは findCandidates() だけを書き換えればよい。
     描画側は candidates 配列の形だけに依存している。
     ========================================================= */
  const TB_PATTERNS = [
    { key: 'jiriki', label: '自力自在' },
    { key: 'jizai',  label: '自在' }
  ];

  /* 「自力自在」は「自在」を含むため、長い方から先に判定する */
  function matchComment(text) {
    const t = String(text || '');
    for (const pat of TB_PATTERNS) {
      if (t.indexOf(pat.label) >= 0) return pat;
    }
    return null;
  }

  /* 並び文字列 "1-2-3 4-5 6" → [[1,2,3],[4,5],[6]] */
  function parseLines(lines) {
    return String(lines || '').trim()
      .split(/[・\s]+/).filter(Boolean)
      .map(g => g.split('').filter(c => /[1-9]/.test(c)).map(Number))
      .filter(g => g.length);
  }

  /* ライン内での位置。飛びつきは番手争いなので位置が判断材料になる */
  function positionOf(groups, car) {
    for (const g of groups) {
      const i = g.indexOf(car);
      if (i < 0) continue;
      if (g.length === 1) return { group: g, index: i, label: '単騎' };
      if (i === 0) return { group: g, index: i, label: '先頭' };
      if (i === 1) return { group: g, index: i, label: '番手' };
      return { group: g, index: i, label: `${i + 1}番手` };
    }
    return { group: [], index: -1, label: '並び不明' };
  }

  function findCandidates(race) {
    const groups = parseLines(race.lines);
    return (race.racers || []).map(r => {
      const hit = matchComment(r['コメント']);
      if (!hit) return null;
      return { racer: r, hit, pos: positionOf(groups, Number(r['車番'])) };
    }).filter(Boolean);
  }

  /* =========================================================
     描画
     ========================================================= */
  function candidateHtml(c) {
    const r = c.racer;
    return `
      <div class="tb-move">
        <span class="tb-move__who">
          ${KUI.bikeBadge(r['車番'], 'lg')}
          <span>${esc(r['選手名'])}</span>
          <span class="badge badge--red">${esc(c.hit.label)}</span>
          <span class="muted small">${esc(c.pos.label)}</span>
        </span>
        <span class="tb-cmt">${esc(r['コメント'] ?? '')}</span>
      </div>`;
  }

  function raceCard(day, race, cands) {
    const body = cands.length
      ? cands.map(candidateHtml).join('')
      : `<div class="tb-none">コメントに「自力自在」「自在」のある選手なし</div>`;

    return `
      <div class="card" style="margin-bottom:14px;">
        <div class="card__head">
          <span class="badge badge--navy">${esc(race.race_num)}R</span>
          <h2 class="card__title">${esc(race.race_name)}</h2>
          <span class="section-head__tail">
            ${cands.length
              ? `<span class="tb-rank tb-rank--s">候補 <b>${cands.length}</b></span>`
              : '<span class="badge">候補なし</span>'}
          </span>
        </div>
        <div style="padding:12px;">
          <div class="lines" style="margin-bottom:10px;">
            <span class="muted small">並び</span>${KUI.linesHtml(race.lines)}
          </div>
          ${body}
          <div style="margin-top:10px;">
            <a class="btn btn--sm" href="race.html?date=${state.date}&place=${encodeURIComponent(day.place)}">
              ${esc(race.race_num)}R の出走表 ›
            </a>
          </div>
        </div>
      </div>`;
  }

  function render() {
    const day = currentDay();
    if (!day) return;

    renderDayChips();
    el.raceLink.href = `race.html?date=${state.date}&place=${encodeURIComponent(day.place)}`;

    const analyzed = day.races.map(race => ({ race, cands: findCandidates(race) }));
    const hitRaces = analyzed.filter(x => x.cands.length);
    const total = hitRaces.reduce((n, x) => n + x.cands.length, 0);
    const shown = state.filterMode === 'all' ? analyzed : hitRaces;

    el.heroMeta.innerHTML = `
      <span class="ch-stat">${esc(day.place)} ${esc(day.race_day)}日目</span>
      <span class="ch-stat">全 <b>${day.races.length}</b> R</span>
      <span class="ch-stat">候補あり <b>${hitRaces.length}</b> R</span>
      <span class="ch-stat">候補選手 <b>${total}</b> 人</span>`;

    el.content.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;
           padding:10px 12px;background:var(--panel);border:1px solid var(--line);
           border-left:4px solid var(--red);border-radius:var(--radius);
           box-shadow:var(--shadow);margin-bottom:14px;">
        ${KUI.gradeBadge(day.grade)}
        <span style="font-size:18px;font-weight:800;">${esc(day.place)}競輪</span>
        <span class="badge badge--navy">${esc(day.race_day)}日目</span>
        <span class="badge">表示 ${shown.length} / ${day.races.length}R</span>
      </div>
      ${shown.length
        ? shown.map(x => raceCard(day, x.race, x.cands)).join('')
        : `<div class="state">飛びつき候補のいるレースはありませんでした</div>`}`;
  }

  function renderDayChips() {
    el.dayChips.innerHTML = state.days.map((d, i) => `
      <button class="chip${i === state.dayIndex ? ' is-active' : ''}" data-day="${i}" type="button">
        ${KUI.gradeBadge(d.grade)}
        <span>${esc(d.place)}</span>
        <span class="chip__sub">${esc(d.race_day)}日目</span>
      </button>`).join('');
  }

  /* =========================================================
     読み込み
     ========================================================= */
  async function load(dateStr, preferPlace) {
    state.date = dateStr;
    el.dateInput.value = dateStr;
    el.dateLabel.textContent = KUI.labelDate(dateStr);
    el.content.hidden = true;
    el.loadState.hidden = false;
    el.loadState.className = 'state';
    el.loadState.textContent = '読み込み中…';
    el.dayChips.innerHTML = '';
    el.heroMeta.innerHTML = '';

    try {
      const days = await KUI.fetchRaceInfo(dateStr);
      if (!Array.isArray(days) || !days.length) throw new Error('empty');

      state.days = days;
      state.dayIndex = 0;
      if (preferPlace) {
        const i = days.findIndex(d => d.place === preferPlace);
        if (i >= 0) state.dayIndex = i;
      }
      el.loadState.hidden = true;
      el.content.hidden = false;
      render();
    } catch (e) {
      state.days = [];
      el.content.hidden = true;
      el.loadState.hidden = false;
      el.loadState.className = 'state state--error';
      el.loadState.textContent = `${KUI.labelDate(dateStr)}の出走表データが見つかりませんでした`;
    }
  }

  /* =========================================================
     イベント
     ========================================================= */
  el.dateInput.addEventListener('change', e => load(e.target.value));
  el.prevDay.addEventListener('click', () => load(KUI.shiftDate(state.date, -1)));
  el.nextDay.addEventListener('click', () => load(KUI.shiftDate(state.date, 1)));

  el.filterMode.addEventListener('change', e => {
    state.filterMode = e.target.value;
    if (state.days.length) render();
  });

  el.dayChips.addEventListener('click', e => {
    const btn = e.target.closest('[data-day]');
    if (!btn) return;
    state.dayIndex = Number(btn.dataset.day);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* =========================================================
     初期化（JST 22時で翌日へ切り替え）
     ========================================================= */
  function defaultDate() {
    const now = new Date();
    const base = new Date(now);
    if (now.getHours() >= 22) base.setDate(base.getDate() + 1);
    return KUI.ymd(base);
  }

  KUI.mountChrome('channel.html');
  state.filterMode = el.filterMode.value;

  const params = new URLSearchParams(location.search);
  load(params.get('date') || defaultDate(), params.get('place'));
})();
</script>
</body>
</html>
