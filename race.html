<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>レース情報</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-6xl mx-auto p-3 sm:p-4">
    <h1 class="text-xl sm:text-2xl font-bold mb-3">レース情報</h1>

    <!-- 日付・開催選択 -->
    <div class="mb-4 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
      <div class="flex items-center gap-2">
        <label for="dateInput" class="text-sm text-gray-600 shrink-0">日付：</label>
        <input id="dateInput" type="date" class="border rounded px-2 py-1 flex-1 sm:flex-none" />
      </div>
      <div class="flex items-center gap-2 sm:ml-2">
        <label for="daySelect" class="text-sm text-gray-600 shrink-0">開催：</label>
        <select id="daySelect" class="border rounded px-2 py-1 flex-1 sm:flex-none max-w-full"></select>
      </div>
    </div>

    <!-- 会員限定バナー（非会員時のみ表示） -->
    <div id="lockBanner" class="hidden mb-4 rounded-lg border border-amber-300 bg-amber-50 p-3 sm:p-4">
      <p class="text-sm font-bold text-amber-900 mb-1">🔒 脚評価・評価コメントは会員限定です</p>
      <p class="text-xs text-amber-800 leading-relaxed">
        出走表・成績データは無料でご覧いただけます。独自の脚評価と評価コメントは会員登録後に表示されます。
      </p>
    </div>

    <!-- content -->
    <div id="content" class="space-y-4 sm:space-y-6"></div>
  </div>

  <script>
    const dateInput = document.getElementById('dateInput');
    const daySelect = document.getElementById('daySelect');
    const content = document.getElementById('content');
    const lockBanner = document.getElementById('lockBanner');

    let raceData = [];

    // ================================
    // GETパラメータ取得
    // ================================
    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        date: params.get('date'),
        place: params.get('place'),
        preview: params.get('preview')
      };
    }

    const { date: queryDate, place: queryPlace, preview } = getQueryParams();

    // ================================
    // 会員判定（暫定）
    //
    // 注意: これはUI確認用の暫定実装であり、認証ではない。
    // 静的サイトである以上クライアント側の判定は誰でも書き換えられる。
    // 本番の出し分けはPhase 2でサーバー側に実装し、
    // 非会員には評価データ自体を配信しない方式に置き換える。
    // ================================
    const MEMBER_KEY = 'asilog:member';
    const isMember = preview === 'member' || localStorage.getItem(MEMBER_KEY) === '1';

    lockBanner.classList.toggle('hidden', isMember);

    // ================================
    // 日付初期化（GET優先 / JST 22時切り替え）
    // ================================

    const now = new Date();

    const baseDate = new Date(now);
    if (now.getHours() >= 22) {
      baseDate.setDate(baseDate.getDate() + 1);
    }

    // YYYY-MM-DD 形式
    const baseDateStr = baseDate.toLocaleDateString('sv-SE');

    // GET パラメータがあればそれを優先
    dateInput.value = queryDate ?? baseDateStr;

    dateInput.addEventListener('change', e => {
      loadByDate(e.target.value);
    });

    // ================================
    // データ読み込み
    // ================================
    async function loadByDate(dateStr) {
      const filename = `race_info_${dateStr.replace(/-/g, '')}.json`;

      content.innerHTML = '読み込み中...';
      daySelect.innerHTML = '';

      try {
        const res = await fetch(`https://storage.googleapis.com/asilogkeirin/race_info/${filename}`);
        if (!res.ok) throw new Error('file not found');

        raceData = await res.json();

        renderDaySelect();

        // place パラメータがあれば該当開催を選択
        let index = 0;
        if (queryPlace) {
          const found = raceData.findIndex(d => d.place === queryPlace);
          if (found >= 0) index = found;
        }

        daySelect.value = index;
        renderByIndex(index);

      } catch (e) {
        content.innerHTML = 'データを読み込めませんでした';
      }
    }

    // ================================
    // 開催 select 描画
    // ================================
    function renderDaySelect() {
      daySelect.innerHTML = '';

      raceData.forEach((day, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${day.place} / ${day.grade} / ${day.race_day}日目`;
        daySelect.appendChild(opt);
      });

      daySelect.onchange = e => {
        renderByIndex(Number(e.target.value));
      };
    }

    // ================================
    // 過去評価取得
    // ================================
    function loadPastEvaluation(day, racerName) {
      if (day.race_day <= 1) return '';

      const key = `eval:${day.race_id}:${racerName}`;
      const raw = localStorage.getItem(key);
      if (!raw) return '';

      const ev = JSON.parse(raw);
      return ev.value || '';
    }

    // ================================
    // 前日コメント取得（単数）
    // ================================
    function loadPastComment(day, racerName) {
      if (day.race_day <= 1) return '';
      const prevIndex = day.race_day - 2;

      const key = `eval:${day.race_id}:${racerName}`;
      const raw = localStorage.getItem(key);
      if (!raw) return '';

      try {
        const data = JSON.parse(raw);
        return data.comments?.[prevIndex] ?? '';
      } catch {
        return '';
      }
    }

    // ================================
    // 会員限定セルの描画
    // 非会員にはダミー文字（■）をぼかして表示する。
    // 実データは渡さない。
    // ================================
    function lockedInline(width = '2.5rem') {
      return `<span class="inline-block align-middle blur-[3px] select-none text-gray-400"
                    style="width:${width}" aria-hidden="true">■■</span>
              <span class="sr-only">会員限定</span>`;
    }

    function memberCell(value, width) {
      return isMember ? (value ?? '') : lockedInline(width);
    }

    // ================================
    // レース描画
    // ================================
    function renderByIndex(index) {
      content.innerHTML = '';

      const target = raceData[index];
      if (!target) return;

      const hasEval = target.race_day >= 2;

      target.races.forEach(race => {
        const raceDiv = document.createElement('div');
        raceDiv.className = 'bg-white rounded shadow p-3 sm:p-4';

        raceDiv.innerHTML = `
          <h2 class="font-bold text-base sm:text-lg mb-1 sm:mb-2">
            ${race.race_num}R ${race.race_name}
          </h2>
          <div class="text-sm text-gray-600 mb-2">
            ライン: ${race.lines}
          </div>

          ${renderTable(target, race, hasEval)}
          ${renderCards(target, race, hasEval)}
        `;

        content.appendChild(raceDiv);
      });
    }

    // --------------------------------
    // PC・タブレット向け: テーブル表示
    // --------------------------------
    function renderTable(target, race, hasEval) {
      return `
        <div class="hidden sm:block overflow-x-auto">
          <table class="w-full text-sm border">
            <thead class="bg-gray-50">
              <tr>
                <th class="border px-1">車</th>
                <th class="border px-1">選手</th>
                ${hasEval ? `<th class="border px-1">評価</th>` : ''}
                <th class="border px-1">競走<br>得点</th>
                <th class="border px-1">脚</th>
                <th class="border px-1">S</th>
                <th class="border px-1">B</th>
                <th class="border px-1">逃</th>
                <th class="border px-1">捲</th>
                <th class="border px-1">差</th>
                <th class="border px-1">マ</th>
                <th class="border px-1">勝率</th>
                <th class="border px-1">2連<br>対率</th>
                <th class="border px-1">3連<br>対率</th>
                ${hasEval
                  ? `<th class="border px-1">前日<br>順位</th>
                     <th class="border px-1">前日<br>上り</th>`
                  : ''
                }
                <th class="border px-1">コメント</th>
                ${hasEval ? `<th class="border px-1">脚ログ</th>` : ''}
              </tr>
            </thead>
            <tbody>
              ${race.racers.map(r => `
                <tr>
                  <td class="border px-1 text-center">${r.車番}</td>
                  <td class="border px-1">
                    <div class="font-medium whitespace-nowrap">${r.選手名}</div>
                    <div class="text-xs text-gray-600 leading-tight">
                      ${r.級班} ${r.年齢} ${r.期別} ${r.府県}
                    </div>
                  </td>
                  ${hasEval
                    ? `<td class="border px-1 text-center">
                         ${memberCell(loadPastEvaluation(target, r.選手名), '2rem')}
                       </td>`
                    : ''
                  }
                  <td class="border px-1 text-right">${r.競走得点}</td>
                  <td class="border px-1">${r.脚質}</td>
                  <td class="border px-1">${r.S}</td>
                  <td class="border px-1">${r.B}</td>
                  <td class="border px-1">${r.逃}</td>
                  <td class="border px-1">${r.捲}</td>
                  <td class="border px-1">${r.差}</td>
                  <td class="border px-1">${r.マ}</td>
                  <td class="border px-1 text-right">${r.勝率}</td>
                  <td class="border px-1 text-right">${r["2連対率"]}</td>
                  <td class="border px-1 text-right">${r["3連対率"]}</td>
                  ${hasEval
                    ? `<td class="border px-1">${r.前日着 ?? ''}</td>
                       <td class="border px-1">${r.前日上り ?? ''}</td>`
                    : ''
                  }
                  <td class="border px-1">${r.コメント ?? ''}</td>
                  ${hasEval
                    ? `<td class="border px-1 text-xs text-gray-700">
                         ${memberCell(loadPastComment(target, r.選手名), '4rem')}
                       </td>`
                    : ''
                  }
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // --------------------------------
    // モバイル向け: 選手カード表示
    // 18列のテーブルは狭い画面で読めないため、
    // 1選手 = 1カードに組み替える
    // --------------------------------
    function renderCards(target, race, hasEval) {
      const stat = (label, value) => `
        <div>
          <dt class="text-[10px] text-gray-500 leading-none">${label}</dt>
          <dd class="text-sm font-medium leading-tight">${value ?? '-'}</dd>
        </div>
      `;

      return `
        <div class="sm:hidden space-y-2">
          ${race.racers.map(r => `
            <div class="border rounded p-2">
              <div class="flex items-start gap-2">
                <span class="shrink-0 w-7 h-7 rounded bg-gray-800 text-white
                             flex items-center justify-center font-bold text-sm">
                  ${r.車番}
                </span>
                <div class="min-w-0 flex-1">
                  <div class="font-bold leading-tight">${r.選手名}</div>
                  <div class="text-xs text-gray-600 leading-tight">
                    ${r.級班} ${r.年齢} ${r.期別} ${r.府県}
                  </div>
                </div>
                ${hasEval
                  ? `<div class="shrink-0 text-right">
                       <div class="text-[10px] text-gray-500 leading-none">評価</div>
                       <div class="font-bold text-sm leading-tight">
                         ${memberCell(loadPastEvaluation(target, r.選手名), '2rem')}
                       </div>
                     </div>`
                  : ''
                }
              </div>

              <dl class="grid grid-cols-4 gap-x-2 gap-y-1 mt-2">
                ${stat('得点', r.競走得点)}
                ${stat('脚質', r.脚質)}
                ${stat('S', r.S)}
                ${stat('B', r.B)}
                ${stat('逃', r.逃)}
                ${stat('捲', r.捲)}
                ${stat('差', r.差)}
                ${stat('マ', r.マ)}
                ${stat('勝率', r.勝率)}
                ${stat('2連対', r["2連対率"])}
                ${stat('3連対', r["3連対率"])}
                ${hasEval ? stat('前日着', r.前日着) : ''}
                ${hasEval ? stat('前日上り', r.前日上り) : ''}
              </dl>

              ${r.コメント
                ? `<p class="mt-2 pt-2 border-t text-xs text-gray-700 leading-relaxed">
                     ${r.コメント}
                   </p>`
                : ''
              }

              ${hasEval
                ? `<div class="mt-2 pt-2 border-t">
                     <div class="text-[10px] text-gray-500 leading-none mb-1">脚ログ</div>
                     <div class="text-xs text-gray-700 leading-relaxed">
                       ${memberCell(loadPastComment(target, r.選手名), '6rem')}
                     </div>
                   </div>`
                : ''
              }
            </div>
          `).join('')}
        </div>
      `;
    }

    // ================================
    // 初期ロード
    // ================================
    loadByDate(dateInput.value);
  </script>
</body>
</html>
