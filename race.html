<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>レース情報 | 飛びつきチャンネル</title>
<link rel="stylesheet" href="assets/keirin-ui.css?v=20260927b" />
<style>
  .sticky-bar {
    position: sticky;
    top: var(--header-h);
    z-index: 30;
    /* 固定の明るい色だとダークモードで白く浮くため、背景色から作る */
    background: color-mix(in srgb, var(--bg) 95%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
  }
  .sticky-bar .chips { margin-top: 8px; }
  .date-nav { display: inline-flex; align-items: center; gap: 6px; }
  .race-no {
    display: inline-grid;
    place-items: center;
    min-width: 40px;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: var(--navy);
    color: #fff;
    font-family: var(--font-num);
    font-size: 15px;
    font-weight: 800;
  }
  .day-summary {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--navy);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .day-summary__place { font-size: 18px; font-weight: 800; }

  /* 固定列の幅と位置（固定の仕組み自体は keirin-ui.css の .frz）。
     col-name の --frz-left は col-car の実幅と一致させる必要があるため、
     どちらも min/max-width で幅を固定している */
  .col-car  { --frz-left: 0;      min-width: 2.6rem; max-width: 2.6rem; }
  .col-name {
    --frz-left: 2.6rem;
    min-width: 7.6rem;
    max-width: 7.6rem;
    overflow: hidden;
    text-align: left;
  }

  /* 会員限定セルのモザイク。実データはDOMに入れない */
  .locked {
    display: inline-block;
    vertical-align: middle;
    color: var(--ink-3);
    filter: blur(3px);
    user-select: none;
    letter-spacing: .1em;
  }

  /* 会員表示の切り替え（表示確認用） */
  .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .seg button {
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    background: var(--panel);
    color: var(--ink-3);
    border: 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.is-active { background: var(--navy); color: #fff; }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="page-head">
  <div class="page-head__inner">
    <h1 class="page-title">レース情報</h1>
    <span class="page-en">RACE CARD</span>
  </div>
</div>

<div class="sticky-bar">
  <div class="wrap wrap--wide">
    <div class="toolbar">
      <span class="field">
        日付
        <span class="date-nav">
          <button class="btn btn--sm" id="prevDay" type="button">‹ 前日</button>
          <input class="input" id="dateInput" type="date" />
          <button class="btn btn--sm" id="nextDay" type="button">翌日 ›</button>
        </span>
      </span>
      <span class="badge badge--navy" id="dateLabel"></span>
      <span class="section-head__tail">
        <span class="seg" id="memberToggle">
          <button type="button" data-member="0">ログイン前</button>
          <button type="button" data-member="1">ログイン後</button>
        </span>
        <a class="btn btn--sm btn--navy" id="channelLink" href="channel.html">飛びつきチャンネルで見る</a>
      </span>
    </div>
    <div class="chips" id="dayChips"></div>
  </div>
</div>

<main class="wrap wrap--wide" style="padding-top:14px;">
  <div class="notice" id="lockBanner" hidden style="margin-bottom:14px;">
    <b>🔒 脚評価・評価コメントは会員限定です</b><br>
    出走表・成績データは無料でご覧いただけます。独自の脚評価と評価コメントは会員登録後に表示されます。
  </div>
  <div id="loadState" class="state">読み込み中…</div>
  <div id="content" hidden></div>
</main>

<div id="siteFooter"></div>

<script src="assets/keirin-ui.js?v=20260927b"></script>
<script>
(function () {
  'use strict';

  /* 共通スクリプトが読めない・古い版がキャッシュに残っている場合に、
     「読み込み中…」のまま止まらないよう案内を出す */
  if (!window.KUI || typeof KUI.nextRaceNum !== 'function') {
    const s = document.getElementById('loadState');
    s.className = 'state state--error';
    s.textContent = '表示に必要なファイルを読み込めませんでした。ページを再読み込みしてください';
    return;
  }

  const esc = KUI.esc;

  /* view: 表示中のレース番号、'all'（全レース）、null（既定＝次に発走するレース） */
  const state = { date: '', days: [], dayIndex: 0, finished: {}, view: null };

  const el = {
    dateInput:   document.getElementById('dateInput'),
    dateLabel:   document.getElementById('dateLabel'),
    prevDay:     document.getElementById('prevDay'),
    nextDay:     document.getElementById('nextDay'),
    dayChips:    document.getElementById('dayChips'),
    loadState:   document.getElementById('loadState'),
    content:     document.getElementById('content'),
    channelLink:  document.getElementById('channelLink'),
    lockBanner:   document.getElementById('lockBanner'),
    memberToggle: document.getElementById('memberToggle')
  };

  const currentDay = () => state.days[state.dayIndex];

  /* ================================
     会員判定（暫定）

     注意: これは表示確認用の暫定実装であり、認証ではない。
     静的サイトである以上クライアント側の判定は誰でも書き換えられる。
     本番の出し分けはPhase 2でサーバー側に実装し、
     非会員には評価データ自体を配信しない方式に置き換える。
     ================================ */
  const MEMBER_KEY = 'asilog:member';
  const params0 = new URLSearchParams(location.search);
  let isMember = params0.get('preview') === 'member'
    || localStorage.getItem(MEMBER_KEY) === '1';

  function applyMemberState() {
    el.lockBanner.hidden = isMember;
    el.memberToggle.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('is-active', (btn.dataset.member === '1') === isMember);
    });
    if (state.days.length) render();
  }

  /* 会員限定セル。ログイン前は実データを渡さずダミー文字をぼかす。
     role="img" + aria-label で読み上げは「会員限定」になる */
  function memberCell(value, width) {
    if (isMember) return esc(value ?? '');
    return `<span class="locked" style="width:${width}"
                  role="img" aria-label="会員限定">■■</span>`;
  }

  /* ================================
     過去評価・前日コメント取得
     ================================ */
  function pastEvaluation(day, racerName) {
    if (day.race_day <= 1) return '';
    const ev = KUI.loadEvalRaw(day.race_id, racerName);
    return ev && ev.value ? ev.value : '';
  }

  function pastComment(day, racerName) {
    if (day.race_day <= 1) return '';
    const ev = KUI.loadEvalRaw(day.race_id, racerName);
    if (!ev) return '';
    return ev.comments[day.race_day - 2] || '';
  }

  /* ================================
     開催チップ
     ================================ */
  function renderDayChips() {
    el.dayChips.innerHTML = state.days.map((d, i) => `
      <button class="chip${i === state.dayIndex ? ' is-active' : ''}" data-day="${i}" type="button">
        ${KUI.gradeBadge(d.grade)}
        <span>${esc(d.place)}</span>
        <span class="chip__sub">${esc(d.race_day)}日目</span>
      </button>`).join('');
  }

  /* ================================
     発走済みの判定
     結果 JSON に載っているレースを発走済みとみなす。
     注意: 結果 JSON はレース翌日の 00:12 に1回だけ置かれるため、
     レース当日の日中は全レースが発走前扱いになり「次に発走」は 1R になる。
     ================================ */
  function isFinished(day, race) {
    const done = state.finished[day.place];
    return !!done && done.has(Number(race.race_num));
  }

  function nextRaceNum(day) {
    return KUI.nextRaceNum(day.races, state.finished[day.place]);
  }

  /* ================================
     レース別タブ
     ================================ */
  function renderRaceTabs(day, selected, next) {
    return `
      <div class="chips" id="raceTabs" style="margin-bottom:10px;">
        ${day.races.map(r => `
          <button class="chip chip--race${selected === Number(r.race_num) ? ' is-active' : ''}"
            data-race="${esc(r.race_num)}" type="button">${esc(r.race_num)}R${Number(r.race_num) === next ? '<span class="chip__next">次</span>' : ''}</button>`).join('')}
        <button class="chip chip--all${selected === 'all' ? ' is-active' : ''}"
          data-race="all" type="button">全レース表示</button>
      </div>`;
  }

  /* ================================
     レース描画
     ================================ */
  function raceCard(day, race, isNext) {
    const withPrev = day.race_day >= 2;

    return `
      <div class="card" style="margin-bottom:14px;">
        <div class="card__head">
          <span class="race-no">${esc(race.race_num)}R</span>
          <h2 class="card__title">${esc(race.race_name)}</h2>
          ${isNext ? '<span class="badge badge--red">次に発走</span>' : ''}
          <span class="section-head__tail lines">
            <span class="muted small">並び</span>${KUI.linesHtml(race.lines)}
          </span>
        </div>
        <div class="table-scroll" style="border:0;border-radius:0 0 var(--radius) var(--radius);">
          <table class="tbl">
            <thead>
              <tr>
                <th class="frz col-car">車</th>
                <th class="frz frz--edge col-name">選手</th>
                ${withPrev ? '<th>評価</th>' : ''}
                <th>競走<br>得点</th>
                <th>脚</th>
                <th>S</th>
                <th>B</th>
                <th>逃</th>
                <th>捲</th>
                <th>差</th>
                <th>マ</th>
                <th>勝率</th>
                <th>2連<br>対率</th>
                <th>3連<br>対率</th>
                ${withPrev ? '<th>前日<br>順位</th><th>前日<br>上り</th>' : ''}
                <th class="txt--note">コメント</th>
                ${withPrev ? '<th class="txt--note">脚ログ</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${race.racers.map((r, i) => {
                const evalValue = pastEvaluation(day, r['選手名']);
                return `
                <tr>
                  <td class="frz col-car">${KUI.racerBikeBadge(r, i)}</td>
                  <td class="frz frz--edge col-name">
                    <div class="racer-name">${esc(r['選手名'])}</div>
                    <div class="racer-meta">${esc(r['級班'])} ${esc(r['年齢'])} ${esc(r['期別'])} ${esc(r['府県'])}</div>
                  </td>
                  ${withPrev ? `<td>${!isMember
                    ? memberCell(null, '2rem')
                    : (evalValue
                        ? `<span class="badge badge--red">${esc(evalValue)}</span>`
                        : '<span class="muted">-</span>')}</td>` : ''}
                  <td class="num">${esc(r['競走得点'])}</td>
                  <td>${KUI.legBadge(r['脚質'])}</td>
                  <td class="num">${esc(r['S'])}</td>
                  <td class="num">${esc(r['B'])}</td>
                  <td class="num">${esc(r['逃'])}</td>
                  <td class="num">${esc(r['捲'])}</td>
                  <td class="num">${esc(r['差'])}</td>
                  <td class="num">${esc(r['マ'])}</td>
                  <td class="num">${esc(r['勝率'])}</td>
                  <td class="num">${esc(r['2連対率'])}</td>
                  <td class="num">${esc(r['3連対率'])}</td>
                  ${withPrev ? `
                    <td class="num">${esc(r['前日着'] ?? '')}</td>
                    <td class="num">${esc(r['前日上り'] ?? '')}</td>` : ''}
                  <td class="txt txt--note"><div class="clamp2" title="${esc(r['コメント'] ?? '')}">${esc(r['コメント'] ?? '')}</div></td>
                  ${withPrev ? `<td class="txt txt--note small"><div class="clamp2"${isMember ? ` title="${esc(pastComment(day, r['選手名']))}"` : ''}>${memberCell(pastComment(day, r['選手名']), '5rem')}</div></td>` : ''}
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function render() {
    const day = currentDay();
    if (!day) return;

    renderDayChips();
    el.channelLink.href = `channel.html?date=${state.date}&place=${encodeURIComponent(day.place)}`;

    const next = nextRaceNum(day);
    const exists = n => day.races.some(r => Number(r.race_num) === n);
    const selected = state.view === 'all' ? 'all'
      : exists(state.view) ? state.view
      : (next ?? Number(day.races[0].race_num));

    let cards;
    if (selected === 'all') {
      // 次に発走するレースから順に、発走済みのレースは新しい順で後ろに並べる
      const upcoming = day.races.filter(r => !isFinished(day, r));
      const finished = day.races.filter(r => isFinished(day, r)).reverse();
      cards = upcoming.map(r => raceCard(day, r, Number(r.race_num) === next)).join('')
        + (finished.length ? '<div class="race-group-label">発走済みのレース</div>' : '')
        + finished.map(r => raceCard(day, r, false)).join('');
    } else {
      const race = day.races.find(r => Number(r.race_num) === selected);
      cards = raceCard(day, race, selected === next);
    }

    el.content.innerHTML = `
      <div class="day-summary">
        ${KUI.gradeBadge(day.grade)}
        <span class="day-summary__place">${esc(day.place)}競輪</span>
        <span class="badge badge--navy">${esc(day.race_day)}日目</span>
        <span class="badge">全${day.races.length}R</span>
        <span class="section-head__tail small muted">開催ID ${esc(day.race_id)}</span>
      </div>
      ${renderRaceTabs(day, selected, next)}
      ${cards}`;
  }

  /* ================================
     読み込み
     ================================ */
  async function load(dateStr, preferPlace, preferRace) {
    state.date = dateStr;
    el.dateInput.value = dateStr;
    el.dateLabel.textContent = KUI.labelDate(dateStr);
    el.content.hidden = true;
    el.loadState.hidden = false;
    el.loadState.className = 'state';
    el.loadState.textContent = '読み込み中…';
    el.dayChips.innerHTML = '';

    try {
      // 結果は無くてもよい（当日分は翌日まで置かれない）
      const [days, results] = await Promise.all([
        KUI.fetchRaceInfo(dateStr),
        KUI.fetchRaceResult(dateStr).catch(() => [])
      ]);
      if (!Array.isArray(days) || !days.length) throw new Error('empty');

      state.finished = KUI.finishedByPlace(results);

      state.days = days;
      state.dayIndex = 0;
      state.view = preferRace === 'all' ? 'all' : (preferRace ? Number(preferRace) : null);
      if (preferPlace) {
        const i = days.findIndex(d => d.place === preferPlace);
        if (i >= 0) state.dayIndex = i;
      }

      el.loadState.hidden = true;
      el.content.hidden = false;
      render();
    } catch (e) {
      state.days = [];
      el.content.hidden = true;
      el.loadState.hidden = false;
      el.loadState.className = 'state state--error';
      el.loadState.textContent = 'データを読み込めませんでした';
    }
  }

  /* ================================
     イベント
     ================================ */
  el.memberToggle.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    isMember = btn.dataset.member === '1';
    localStorage.setItem(MEMBER_KEY, isMember ? '1' : '0');
    applyMemberState();
  });

  el.dateInput.addEventListener('change', e => load(e.target.value));
  el.prevDay.addEventListener('click', () => load(KUI.shiftDate(state.date, -1)));
  el.nextDay.addEventListener('click', () => load(KUI.shiftDate(state.date, 1)));

  el.dayChips.addEventListener('click', e => {
    const btn = e.target.closest('[data-day]');
    if (!btn) return;
    state.dayIndex = Number(btn.dataset.day);
    state.view = null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  el.content.addEventListener('click', e => {
    const btn = e.target.closest('[data-race]');
    if (!btn) return;
    const v = btn.dataset.race;
    state.view = v === 'all' ? 'all' : Number(v);
    render();
  });

  /* ================================
     初期化（日本時間22時で翌日へ切り替え）
     ================================ */

  KUI.mountChrome('race.html');
  applyMemberState();

  const params = new URLSearchParams(location.search);
  load(params.get('date') || KUI.defaultRaceDate(), params.get('place'), params.get('race'));
})();
</script>
</body>
</html>
