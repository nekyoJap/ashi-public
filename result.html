<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>レース結果 | 飛びつきチャンネル</title>
<link rel="stylesheet" href="assets/keirin-ui.css" />
<style>
  .sticky-bar {
    position: sticky;
    top: var(--header-h);
    z-index: 30;
    background: rgba(238, 241, 245, .95);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
  }
  .sticky-bar .chips { margin-top: 8px; }

  /* 固定列の幅と位置（固定の仕組み自体は keirin-ui.css の .frz）。
     --frz-left は左隣までの実幅の合計と一致させる必要があるため、
     3列とも min/max-width で幅を固定している */
  .rcol-rank { --frz-left: 0;      min-width: 2.4rem; max-width: 2.4rem; }
  .rcol-car  { --frz-left: 2.4rem; min-width: 2.4rem; max-width: 2.4rem; }
  .rcol-name {
    --frz-left: 4.8rem;
    min-width: 6.4rem;
    max-width: 6.4rem;
    overflow: hidden;
    text-align: left;
  }
  .date-nav { display: inline-flex; align-items: center; gap: 6px; }
  .race-no {
    display: inline-grid;
    place-items: center;
    min-width: 40px;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: var(--navy);
    color: #fff;
    font-family: var(--font-num);
    font-size: 15px;
    font-weight: 800;
  }
  .day-summary {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--navy);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .day-summary__place { font-size: 18px; font-weight: 800; }

  /* 着順 */
  .rank {
    display: inline-grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--line-2);
    color: var(--ink-2);
    font-family: var(--font-num);
    font-size: 12px;
    font-weight: 800;
  }
  .rank--1 { background: #f5b400; color: #4a3400; }
  .rank--2 { background: #c4ccd6; color: #2b3542; }
  .rank--3 { background: #d9a273; color: #4a2f13; }

  .video-wrap { padding: 12px 12px 0; }
  .video-wrap video {
    width: 100%;
    max-width: 620px;
    border-radius: var(--radius-sm);
    background: #000;
    display: block;
  }
  .cmt {
    display: inline-block;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
    cursor: help;
  }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="page-head">
  <div class="page-head__inner">
    <h1 class="page-title">レース結果</h1>
    <span class="page-en">RACE RESULT</span>
  </div>
</div>

<div class="sticky-bar">
  <div class="wrap wrap--wide">
    <div class="toolbar">
      <span class="field">
        日付
        <span class="date-nav">
          <button class="btn btn--sm" id="prevDay" type="button">‹ 前日</button>
          <input class="input" id="dateInput" type="date" />
          <button class="btn btn--sm" id="nextDay" type="button">翌日 ›</button>
        </span>
      </span>
      <span class="badge badge--navy" id="dateLabel"></span>
    </div>
    <div class="chips" id="dayChips"></div>
  </div>
</div>

<main class="wrap wrap--wide" style="padding-top:14px;">
  <div id="loadState" class="state">読み込み中…</div>

  <div id="mainArea" hidden>
    <div class="day-summary" id="daySummary"></div>
    <div class="chips" id="raceChips" style="margin-bottom:10px;"></div>
    <div id="raceDetail"></div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="assets/keirin-ui.js"></script>
<script>
(function () {
  'use strict';

  const esc = KUI.esc;

  const EVAL_OPTIONS = ['S', 'A+', 'A', 'A-', 'B+', 'B', 'B-', 'C', 'D'];

  const state = {
    date: '',
    days: [],
    dayIndex: 0,
    view: { mode: 'single', index: 0 }
  };

  const el = {
    dateInput:  document.getElementById('dateInput'),
    dateLabel:  document.getElementById('dateLabel'),
    prevDay:    document.getElementById('prevDay'),
    nextDay:    document.getElementById('nextDay'),
    dayChips:   document.getElementById('dayChips'),
    loadState:  document.getElementById('loadState'),
    mainArea:   document.getElementById('mainArea'),
    daySummary: document.getElementById('daySummary'),
    raceChips:  document.getElementById('raceChips'),
    raceDetail: document.getElementById('raceDetail')
  };

  const currentDay = () => state.days[state.dayIndex];

  /* ================================
     評価の保存・取得（localStorage）
     ================================ */
  function saveEvaluation(day, racerName, value, comment) {
    const key = KUI.evalKey(day.race_id, racerName);
    const idx = day.race_day - 1;

    let data = { value: '', comments: [] };
    const raw = localStorage.getItem(key);
    if (raw) {
      try {
        data = JSON.parse(raw);
        data.comments = data.comments || [];
      } catch (e) { /* 壊れていたら作り直す */ }
    }

    data.value = value;
    data.comments[idx] = comment;
    localStorage.setItem(key, JSON.stringify(data));
  }

  function loadEvaluation(day, racerName) {
    const data = KUI.loadEvalRaw(day.race_id, racerName);
    if (!data) return { value: '', comment: '' };
    return {
      value: data.value || '',
      comment: data.comments[day.race_day - 1] || ''
    };
  }

  /* ================================
     開催チップ
     ================================ */
  function renderDayChips() {
    el.dayChips.innerHTML = state.days.map((d, i) => `
      <button class="chip${i === state.dayIndex ? ' is-active' : ''}" data-day="${i}" type="button">
        ${KUI.gradeBadge(d.grade)}
        <span>${esc(d.place)}</span>
        <span class="chip__sub">${esc(d.race_day)}日目</span>
      </button>`).join('');
  }

  function renderDaySummary() {
    const day = currentDay();
    const hasFinal = day.races.some(r =>
      r.race_name.includes('決勝') && !r.race_name.includes('準決勝'));
    const nextUrl = `race.html?date=${KUI.shiftDate(state.date, 1)}&place=${encodeURIComponent(day.place)}`;

    el.daySummary.innerHTML = `
      ${KUI.gradeBadge(day.grade)}
      <span class="day-summary__place">${esc(day.place)}競輪</span>
      <span class="badge badge--navy">${esc(day.race_day)}日目</span>
      <span class="badge">全${day.races.length}R</span>
      <span class="small muted">開催ID ${esc(day.race_id)}</span>
      <span class="section-head__tail">
        ${hasFinal ? '<span class="badge badge--red">最終日（決勝）</span>'
                   : `<a class="btn btn--sm" href="${nextUrl}">次の日の出走表 ›</a>`}
        <button class="btn btn--sm btn--navy" id="copyAllBtn" type="button">全レースをコピー</button>
      </span>`;

    document.getElementById('copyAllBtn').onclick = onCopyAll;
  }

  /* ================================
     レースチップ
     ================================ */
  function renderRaceChips() {
    const day = currentDay();
    el.raceChips.innerHTML = day.races.map((race, i) => `
      <button class="chip chip--race${state.view.mode === 'single' && state.view.index === i ? ' is-active' : ''}"
        data-race-index="${i}" type="button">${esc(race.race_num)}R</button>`).join('') + `
      <button class="chip chip--all${state.view.mode === 'all' ? ' is-active' : ''}"
        data-race-index="all" type="button">全レース表示</button>`;
  }

  /* ================================
     レース描画
     ================================ */
  function rankBadge(rank) {
    const n = Number(rank);
    const cls = n >= 1 && n <= 3 ? ` rank--${n}` : '';
    return `<span class="rank${cls}">${esc(rank)}</span>`;
  }

  function evalCell(day, racerName) {
    const ev = loadEvaluation(day, racerName);
    const options = ['<option value="">-</option>'].concat(
      EVAL_OPTIONS.map(v =>
        `<option value="${v}"${ev.value === v ? ' selected' : ''}>${v}</option>`)
    ).join('');

    return `
      <td>
        <select class="select eval-select" data-racer="${esc(racerName)}">${options}</select>
      </td>
      <td class="txt txt--note">
        <textarea class="textarea eval-comment" rows="1"
          data-racer="${esc(racerName)}">${esc(ev.comment)}</textarea>
      </td>`;
  }

  function raceCard(day, race, options) {
    const showVideo = options && options.video;
    const showRaceComment = options && options.raceComment;

    return `
      <div class="card" style="margin-bottom:14px;">
        <div class="card__head">
          <span class="race-no">${esc(race.race_num)}R</span>
          <h2 class="card__title">${esc(race.race_name)}</h2>
          ${race.lines ? `<span class="section-head__tail lines">
            <span class="muted small">並び</span>${KUI.linesHtml(race.lines)}
          </span>` : ''}
        </div>

        ${showVideo && race.video_url ? `
          <div class="video-wrap">
            <video src="${esc(race.video_url)}" controls preload="none"></video>
          </div>` : ''}

        <div class="table-scroll" style="border:0;border-radius:0 0 var(--radius) var(--radius);margin-top:12px;">
          <table class="tbl">
            <thead>
              <tr>
                <th class="frz rcol-rank">着</th>
                <th class="frz rcol-car">車</th>
                <th class="frz frz--edge rcol-name">選手</th>
                <th>級班</th>
                <th>上り</th>
                <th>決</th>
                <th>SB</th>
                <th>着差</th>
                ${showRaceComment ? '<th class="txt--note">レース後コメント</th>' : ''}
                <th>評価</th>
                <th class="txt--note">コメント</th>
              </tr>
            </thead>
            <tbody>
              ${race.racers.map(r => {
                const comment = r['レース後コメント'] || '';
                return `
                <tr>
                  <td class="frz rcol-rank">${rankBadge(r['着'])}</td>
                  <td class="frz rcol-car">${KUI.bikeBadge(r['車'])}</td>
                  <td class="frz frz--edge rcol-name">
                    <div class="racer-name">${esc(r['選手名'])}</div>
                    <div class="racer-meta">${esc(r['年齢'])} ${esc(r['期別'])} ${esc(r['府県'])}</div>
                  </td>
                  <td>${esc(r['級班'])}</td>
                  <td class="num">${esc(r['上り'])}</td>
                  <td>${esc(r['決'])}</td>
                  <td>${esc(r['SB'])}</td>
                  <td>${esc(r['着差'])}</td>
                  ${showRaceComment ? `<td class="txt txt--note">
                    <div class="clamp2" title="${esc(comment)}">${esc(comment) || '<span class="muted">-</span>'}</div>
                  </td>` : ''}
                  ${evalCell(day, r['選手名'])}
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function bindEvalInputs() {
    const day = currentDay();

    el.raceDetail.querySelectorAll('.eval-select, .eval-comment').forEach(node => {
      node.addEventListener('change', () => {
        const row = node.closest('tr');
        saveEvaluation(
          day,
          node.dataset.racer,
          row.querySelector('.eval-select').value,
          row.querySelector('.eval-comment').value
        );
      });
    });

    el.raceDetail.querySelectorAll('.eval-comment').forEach(node => {
      KUI.autoResize(node);
      node.addEventListener('input', () => KUI.autoResize(node));
    });
  }

  function renderRaceDetail() {
    const day = currentDay();
    renderRaceChips();

    if (state.view.mode === 'all') {
      el.raceDetail.innerHTML = day.races
        .map(race => raceCard(day, race, { video: false, raceComment: false }))
        .join('');
    } else {
      const race = day.races[state.view.index];
      el.raceDetail.innerHTML = race
        ? raceCard(day, race, { video: true, raceComment: true })
        : '<div class="state">レースがありません</div>';
    }

    bindEvalInputs();
  }

  function render() {
    renderDayChips();
    renderDaySummary();
    renderRaceDetail();
  }

  /* ================================
     TSVコピー
     ================================ */
  function sanitizeForTSV(text) {
    if (!text) return '';
    return String(text).replace(/\r?\n/g, ' ').replace(/\t/g, ' ');
  }

  function buildAllRacesTSV(day) {
    const header = ['開催', 'グレード', '日目', 'レース', '着', '車', '選手',
      '級班', '上り', '決', 'SB', '着差', '評価', 'コメント'];
    const lines = [header.join('\t')];

    day.races.forEach((race, raceIdx) => {
      race.racers.forEach(r => {
        const ev = loadEvaluation(day, r['選手名']);
        lines.push([
          day.place, day.grade, day.race_day, race.race_num,
          r['着'], r['車'], r['選手名'], r['級班'], r['上り'],
          r['決'], r['SB'], r['着差'], ev.value, sanitizeForTSV(ev.comment)
        ].join('\t'));
      });
      if (raceIdx < day.races.length - 1) lines.push('');
    });

    return lines.join('\n');
  }

  async function onCopyAll() {
    const btn = document.getElementById('copyAllBtn');
    const tsv = buildAllRacesTSV(currentDay());
    try {
      await navigator.clipboard.writeText(tsv);
      btn.textContent = 'コピーしました';
    } catch (e) {
      btn.textContent = 'コピーできませんでした';
    }
    setTimeout(() => (btn.textContent = '全レースをコピー'), 1500);
  }

  /* ================================
     読み込み
     ================================ */
  async function load(dateStr, preferPlace) {
    state.date = dateStr;
    el.dateInput.value = dateStr;
    el.dateLabel.textContent = KUI.labelDate(dateStr);
    el.mainArea.hidden = true;
    el.loadState.hidden = false;
    el.loadState.className = 'state';
    el.loadState.textContent = '読み込み中…';
    el.dayChips.innerHTML = '';

    try {
      const days = await KUI.fetchRaceResult(dateStr);
      if (!Array.isArray(days) || !days.length) throw new Error('empty');

      state.days = days;
      state.dayIndex = 0;
      if (preferPlace) {
        const i = days.findIndex(d => d.place === preferPlace);
        if (i >= 0) state.dayIndex = i;
      }
      state.view = { mode: 'single', index: 0 };

      el.loadState.hidden = true;
      el.mainArea.hidden = false;
      render();
    } catch (e) {
      state.days = [];
      el.mainArea.hidden = true;
      el.loadState.hidden = false;
      el.loadState.className = 'state state--error';
      el.loadState.textContent = `${KUI.labelDate(dateStr)}の結果データが見つかりませんでした`;
    }
  }

  /* ================================
     イベント
     ================================ */
  el.dateInput.addEventListener('change', e => load(e.target.value));
  el.prevDay.addEventListener('click', () => load(KUI.shiftDate(state.date, -1)));
  el.nextDay.addEventListener('click', () => load(KUI.shiftDate(state.date, 1)));

  el.dayChips.addEventListener('click', e => {
    const btn = e.target.closest('[data-day]');
    if (!btn) return;
    state.dayIndex = Number(btn.dataset.day);
    state.view = { mode: 'single', index: 0 };
    render();
  });

  el.raceChips.addEventListener('click', e => {
    const btn = e.target.closest('[data-race-index]');
    if (!btn) return;
    const v = btn.dataset.raceIndex;
    state.view = v === 'all' ? { mode: 'all' } : { mode: 'single', index: Number(v) };
    renderRaceDetail();
  });

  /* ================================
     初期化（19時前は前日の結果を表示）
     ================================ */
  function defaultDate() {
    const now = new Date();
    const base = new Date(now);
    if (now.getHours() < 19) base.setDate(base.getDate() - 1);
    return KUI.ymd(base);
  }

  KUI.mountChrome('result.html');

  const params = new URLSearchParams(location.search);
  load(params.get('date') || defaultDate(), params.get('place'));
})();
</script>
</body>
</html>
