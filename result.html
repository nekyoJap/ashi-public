<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>レース結果 | 飛びつきチャンネル</title>
<link rel="stylesheet" href="assets/keirin-ui.css?v=20260927e" />
<style>
  .sticky-bar {
    position: sticky;
    top: var(--header-h);
    z-index: 30;
    /* 固定の明るい色だとダークモードで白く浮くため、背景色から作る */
    background: color-mix(in srgb, var(--bg) 95%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
  }
  .sticky-bar .chips { margin-top: 8px; }

  /* 固定列の幅と位置（固定の仕組み自体は keirin-ui.css の .frz）。
     --frz-left は左隣までの実幅の合計と一致させる必要があるため、
     3列とも min/max-width で幅を固定している */
  .rcol-rank { --frz-left: 0;      min-width: 2.4rem; max-width: 2.4rem; }
  .rcol-car  { --frz-left: 2.4rem; min-width: 2.4rem; max-width: 2.4rem; }
  .rcol-name {
    --frz-left: 4.8rem;
    min-width: 6.4rem;
    max-width: 6.4rem;
    overflow: hidden;
    text-align: left;
  }
  .date-nav { display: inline-flex; align-items: center; gap: 6px; }
  .race-no {
    display: inline-grid;
    place-items: center;
    min-width: 40px;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: var(--navy);
    color: #fff;
    font-family: var(--font-num);
    font-size: 15px;
    font-weight: 800;
  }
  .day-summary {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--navy);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .day-summary__place { font-size: 18px; font-weight: 800; }

  /* 着順 */
  .rank {
    display: inline-grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--line-2);
    color: var(--ink-2);
    font-family: var(--font-num);
    font-size: 12px;
    font-weight: 800;
  }
  .rank--1 { background: #f5b400; color: #4a3400; }
  .rank--2 { background: #c4ccd6; color: #2b3542; }
  .rank--3 { background: #d9a273; color: #4a2f13; }

  /* 脚評価（管理者が入れた値を表示するだけ） */
  .eval-mark { font-family: var(--font-num); font-size: 14px; font-weight: 800; color: var(--navy); }
  .cmt {
    display: inline-block;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
    cursor: help;
  }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="page-head">
  <div class="page-head__inner">
    <h1 class="page-title">レース結果</h1>
    <span class="page-en">RACE RESULT</span>
  </div>
</div>

<div class="sticky-bar">
  <div class="wrap wrap--wide">
    <div class="toolbar">
      <span class="field">
        日付
        <span class="date-nav">
          <button class="btn btn--sm" id="prevDay" type="button">‹ 前日</button>
          <input class="input" id="dateInput" type="date" />
          <button class="btn btn--sm" id="nextDay" type="button">翌日 ›</button>
        </span>
      </span>
      <span class="badge badge--navy" id="dateLabel"></span>
    </div>
    <div class="chips" id="dayChips"></div>
  </div>
</div>

<main class="wrap wrap--wide" style="padding-top:14px;">
  <div class="notice" id="membersOnly" hidden style="margin:24px 0;text-align:center;">
    <b>🔒 レース結果は会員限定です</b><br>
    ログインすると、着順・上がりタイム・決まり手と脚評価を見られます。<br>
    <a class="btn btn--navy" id="membersLogin" href="login.html" style="margin-top:10px;">ログインする</a>
  </div>
  <div id="loadState" class="state">読み込み中…</div>

  <div id="mainArea" hidden>
    <div class="day-summary" id="daySummary"></div>
    <div class="chips" id="raceChips" style="margin-bottom:10px;"></div>
    <div id="raceDetail"></div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="assets/keirin-ui.js?v=20260927e"></script>
<script>
(function () {
  'use strict';

  /* 共通スクリプトが読めない・古い版がキャッシュに残っている場合に、
     「読み込み中…」のまま止まらないよう案内を出す */
  if (!window.KUI || typeof KUI.racerNameButton !== 'function') {
    const s = document.getElementById('loadState');
    s.className = 'state state--error';
    s.textContent = '表示に必要なファイルを読み込めませんでした。ページを再読み込みしてください';
    return;
  }

  const esc = KUI.esc;

  const state = {
    date: '',
    days: [],
    dayIndex: 0,
    view: { mode: 'single', index: 0 }
  };

  const el = {
    dateInput:  document.getElementById('dateInput'),
    dateLabel:  document.getElementById('dateLabel'),
    prevDay:    document.getElementById('prevDay'),
    nextDay:    document.getElementById('nextDay'),
    dayChips:   document.getElementById('dayChips'),
    loadState:  document.getElementById('loadState'),
    mainArea:   document.getElementById('mainArea'),
    daySummary: document.getElementById('daySummary'),
    raceChips:  document.getElementById('raceChips'),
    raceDetail: document.getElementById('raceDetail')
  };

  const currentDay = () => state.days[state.dayIndex];

  /* 既定は最新の（番号が最も大きい）確定レース */
  const latestView = () => {
    // 中止などで選手の載っていないレースは飛ばす
    const races = currentDay().races;
    for (let i = races.length - 1; i >= 0; i--) {
      if ((races[i].racers || []).length) return { mode: 'single', index: i };
    }
    return { mode: 'single', index: 0 };
  };

  /* ================================
     開催チップ
     ================================ */
  function renderDayChips() {
    el.dayChips.innerHTML = state.days.map((d, i) => `
      <button class="chip${i === state.dayIndex ? ' is-active' : ''}" data-day="${i}" type="button">
        ${KUI.gradeBadge(d.grade)}
        <span>${esc(d.place)}</span>
        <span class="chip__sub">${esc(d.race_day)}日目</span>
      </button>`).join('');
  }

  function renderDaySummary() {
    const day = currentDay();
    const hasFinal = day.races.some(r =>
      r.race_name.includes('決勝') && !r.race_name.includes('準決勝'));
    const nextUrl = `race.html?date=${KUI.shiftDate(state.date, 1)}&place=${encodeURIComponent(day.place)}`;

    el.daySummary.innerHTML = `
      ${KUI.gradeBadge(day.grade)}
      <span class="day-summary__place">${esc(day.place)}競輪</span>
      <span class="badge badge--navy">${esc(day.race_day)}日目</span>
      <span class="badge">全${day.races.length}R</span>
      <span class="small muted">開催ID ${esc(day.race_id)}</span>
      <span class="section-head__tail">
        ${hasFinal ? '<span class="badge badge--red">最終日（決勝）</span>'
                   : `<a class="btn btn--sm" href="${nextUrl}">次の日の出走表 ›</a>`}
        ${KUI.isAdmin() ? `<a class="btn btn--sm btn--navy" href="admin.html?date=${state.date}&place=${encodeURIComponent(day.place)}">管理画面 ›</a>` : ''}
      </span>`;
  }

  /* ================================
     レースチップ
     ================================ */
  function renderRaceChips() {
    const day = currentDay();
    el.raceChips.innerHTML = day.races.map((race, i) => `
      <button class="chip chip--race${state.view.mode === 'single' && state.view.index === i ? ' is-active' : ''}"
        data-race-index="${i}" type="button">${esc(race.race_num)}R</button>`).join('') + `
      <button class="chip chip--all${state.view.mode === 'all' ? ' is-active' : ''}"
        data-race-index="all" type="button">全レース表示</button>`;
  }

  /* ================================
     レース描画
     ================================ */
  function rankBadge(rank) {
    const n = Number(rank);
    const cls = n >= 1 && n <= 3 ? ` rank--${n}` : '';
    return `<span class="rank${cls}">${esc(rank)}</span>`;
  }

  /* 脚評価と評価コメント。管理者用ページ（admin.html）で入れた値を表示するだけ。
     脚評価はスマホでも横スクロールせずに見えるよう、選手名のすぐ右に置く */
  function evalMarkCell(ev) {
    return `<td>${ev.value ? `<span class="eval-mark">${esc(ev.value)}</span>` : '<span class="muted">-</span>'}</td>`;
  }

  function evalCommentCell(ev) {
    return `<td class="txt txt--note">
        <div class="clamp2" title="${esc(ev.comment)}">${esc(ev.comment) || '<span class="muted">-</span>'}</div>
      </td>`;
  }

  function raceCard(day, race, options) {
    const showRaceComment = options && options.raceComment;

    return `
      <div class="card" style="margin-bottom:14px;">
        <div class="card__head">
          <span class="race-no">${esc(race.race_num)}R</span>
          <h2 class="card__title">${esc(race.race_name)}</h2>
          ${race.lines ? `<span class="section-head__tail lines">
            <span class="muted small">並び</span>${KUI.linesHtml(race.lines)}
          </span>` : ''}
        </div>

        <div class="table-scroll" style="border:0;border-radius:0 0 var(--radius) var(--radius);">
          <table class="tbl">
            <thead>
              <tr>
                <th class="frz rcol-rank">着</th>
                <th class="frz rcol-car">車</th>
                <th class="frz frz--edge rcol-name">選手</th>
                <th>脚評価</th>
                <th>級班</th>
                <th>上り</th>
                <th>決</th>
                <th>SB</th>
                <th>着差</th>
                ${showRaceComment ? '<th class="txt--note">レース後コメント</th>' : ''}
                <th class="txt--note">評価コメント</th>
              </tr>
            </thead>
            <tbody>
              ${(race.racers || []).map(r => {
                const comment = r['レース後コメント'] || '';
                const ev = KUI.loadEvaluation(day, r['選手名']);
                return `
                <tr>
                  <td class="frz rcol-rank">${rankBadge(r['着'])}</td>
                  <td class="frz rcol-car">${KUI.bikeBadge(r['車'])}</td>
                  <td class="frz frz--edge rcol-name">
                    ${KUI.racerNameButton(r['選手名'], r['期別'], r['府県'])}
                    <div class="racer-meta">${esc(r['年齢'])} ${esc(r['期別'])} ${esc(r['府県'])}</div>
                  </td>
                  ${evalMarkCell(ev)}
                  <td>${esc(r['級班'])}</td>
                  <td class="num">${esc(r['上り'])}</td>
                  <td>${KUI.kimariteBadge(r['決'])}</td>
                  <td>${esc(r['SB'])}</td>
                  <td>${esc(r['着差'])}</td>
                  ${showRaceComment ? `<td class="txt txt--note">
                    <div class="clamp2" title="${esc(comment)}">${esc(comment) || '<span class="muted">-</span>'}</div>
                  </td>` : ''}
                  ${evalCommentCell(ev)}
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function renderRaceDetail() {
    const day = currentDay();
    renderRaceChips();

    if (state.view.mode === 'all') {
      // 最新のレースを上にする
      el.raceDetail.innerHTML = day.races.slice().reverse()
        .map(race => raceCard(day, race, { raceComment: false }))
        .join('');
    } else {
      const race = day.races[state.view.index];
      el.raceDetail.innerHTML = race
        ? raceCard(day, race, { raceComment: true })
        : '<div class="state">レースがありません</div>';
    }

  }

  function render() {
    renderDayChips();
    renderDaySummary();
    renderRaceDetail();
  }

  /* ================================
     読み込み
     ================================ */
  async function load(dateStr, preferPlace) {
    state.date = dateStr;
    el.dateInput.value = dateStr;
    el.dateLabel.textContent = KUI.labelDate(dateStr);
    el.mainArea.hidden = true;
    el.loadState.hidden = false;
    el.loadState.className = 'state';
    el.loadState.textContent = '読み込み中…';
    el.dayChips.innerHTML = '';

    try {
      const days = await KUI.fetchRaceResult(dateStr);
      if (!Array.isArray(days) || !days.length) throw new Error('empty');

      state.days = days;
      state.dayIndex = 0;
      if (preferPlace) {
        const i = days.findIndex(d => d.place === preferPlace);
        if (i >= 0) state.dayIndex = i;
      }
      state.view = latestView();

      el.loadState.hidden = true;
      el.mainArea.hidden = false;
      render();
    } catch (e) {
      state.days = [];
      el.mainArea.hidden = true;
      el.loadState.hidden = false;
      el.loadState.className = 'state state--error';
      el.loadState.textContent = `${KUI.labelDate(dateStr)}の結果データが見つかりませんでした`;
    }
  }

  /* ================================
     イベント
     ================================ */
  el.dateInput.addEventListener('change', e => load(e.target.value));
  el.prevDay.addEventListener('click', () => load(KUI.shiftDate(state.date, -1)));
  el.nextDay.addEventListener('click', () => load(KUI.shiftDate(state.date, 1)));

  el.dayChips.addEventListener('click', e => {
    const btn = e.target.closest('[data-day]');
    if (!btn) return;
    state.dayIndex = Number(btn.dataset.day);
    state.view = latestView();
    render();
  });

  // 選手名タップでメモ。保存・削除したら描き直して 📝 印を更新する
  KUI.bindNoteButtons(el.raceDetail);
  document.addEventListener('kui:note-saved', () => { if (state.days.length) renderRaceDetail(); });

  el.raceChips.addEventListener('click', e => {
    const btn = e.target.closest('[data-race-index]');
    if (!btn) return;
    const v = btn.dataset.raceIndex;
    state.view = v === 'all' ? { mode: 'all' } : { mode: 'single', index: Number(v) };
    renderRaceDetail();
  });

  /* ================================
     初期化（日本時間19時前は前日の結果を表示）
     ================================ */

  KUI.mountChrome('result.html');

  /* ログイン前（レース結果を会員限定にしている間）は、データを取りに行かず案内だけ出す */
  if (!KUI.canSeeResults()) {
    document.querySelector('.sticky-bar').hidden = true;
    el.loadState.hidden = true;
    document.getElementById('membersLogin').href = KUI.loginUrl();
    document.getElementById('membersOnly').hidden = false;
    return;
  }

  const params = new URLSearchParams(location.search);
  load(params.get('date') || KUI.defaultResultDate(), params.get('place'));
})();
</script>
</body>
</html>
