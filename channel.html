<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>飛びつきチャンネル | 飛びつきが起きそうなレースを探す</title>
<meta name="description" content="単騎の選手が他ラインの番手に飛びつきそうなレースを、並び・脚質・競走得点から抽出して一覧表示します。" />
<link rel="stylesheet" href="assets/keirin-ui.css" />
<style>
  /* ===== ヒーロー ===== */
  .ch-hero {
    position: relative;
    color: #fff;
    background:
      radial-gradient(120% 140% at 88% 0%, rgba(215, 0, 46, .55) 0%, rgba(215, 0, 46, 0) 55%),
      linear-gradient(135deg, #16355e 0%, #0e2544 55%, #091a30 100%);
    overflow: hidden;
  }
  .ch-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      -60deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 9px);
    pointer-events: none;
  }
  .ch-hero__inner {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 16px;
    align-items: center;
    padding-top: 20px;
    padding-bottom: 20px;
  }
  .ch-hero__mark {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 62px;
    height: 62px;
    border-radius: 16px;
    background: linear-gradient(140deg, #e4103c, #a80024);
    box-shadow: 0 6px 18px rgba(215, 0, 46, .4), 0 1px 0 rgba(255, 255, 255, .3) inset;
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
  }
  .ch-hero__kicker {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .22em;
    color: #ffc7d3;
  }
  .ch-hero__title {
    margin: 2px 0 4px;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: .03em;
    line-height: 1.15;
  }
  .ch-hero__lead { margin: 0; font-size: 12.5px; color: #c3d3e6; line-height: 1.6; }
  .ch-hero__meta { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }
  .ch-stat {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .1);
    border: 1px solid rgba(255, 255, 255, .16);
    font-size: 11px;
    color: #d7e3f1;
    font-weight: 700;
  }
  .ch-stat b { font-family: var(--font-num); font-size: 14px; color: #fff; }

  /* ===== 固定ツールバー ===== */
  .ch-sticky {
    position: sticky;
    top: var(--header-h);
    z-index: 30;
    background: rgba(238, 241, 245, .95);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 10px 0;
  }
  .ch-sticky .chips { margin-top: 8px; }
  .date-nav { display: inline-flex; align-items: center; gap: 6px; }

  /* ===== 飛びつき度 ===== */
  .tb-rank {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
  }
  .tb-rank b { font-family: var(--font-num); font-size: 14px; }
  .tb-rank--s { background: linear-gradient(140deg, #e4103c, #a80024); }
  .tb-rank--a { background: #d7602b; }
  .tb-rank--b { background: #2f6ea8; }
  .tb-rank--c { background: #7c8894; }

  /* ===== 飛びつき図 ===== */
  .tb-move {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #fff6f8;
    border: 1px solid #f3c9d4;
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
  }
  .tb-move__label {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .12em;
    color: var(--red-dark);
  }
  .tb-move__arrow { color: var(--red); font-weight: 800; font-size: 16px; }
  .tb-move__who { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; }
  .tb-move__grp { display: inline-flex; gap: 2px; }
  .tb-target { outline: 2px solid var(--red); outline-offset: 1px; border-radius: 4px; }

  /* ===== 根拠 ===== */
  .tb-why { margin: 0; padding-left: 1.1em; font-size: 12px; line-height: 1.75; color: var(--ink-2); }
  .tb-why li::marker { color: var(--red); }

  .tb-none { padding: 18px 12px; text-align: center; color: var(--ink-3); font-size: 12.5px; font-weight: 700; }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="ch-hero">
  <div class="wrap wrap--wide ch-hero__inner">
    <div class="ch-hero__mark">飛</div>
    <div>
      <div class="ch-hero__kicker">TOBITSUKI RADAR</div>
      <h1 class="ch-hero__title">飛びつきチャンネル</h1>
      <p class="ch-hero__lead">
        単騎の選手が他ラインの番手に飛びつきそうなレースを、並び・脚質・競走得点から抽出します。
      </p>
      <div class="ch-hero__meta" id="heroMeta"></div>
    </div>
  </div>
</div>

<div class="ch-sticky">
  <div class="wrap wrap--wide">
    <div class="toolbar">
      <span class="field">
        日付
        <span class="date-nav">
          <button class="btn btn--sm" id="prevDay" type="button">‹ 前日</button>
          <input class="input" id="dateInput" type="date" />
          <button class="btn btn--sm" id="nextDay" type="button">翌日 ›</button>
        </span>
      </span>
      <span class="badge badge--navy" id="dateLabel"></span>
      <span class="field">
        表示
        <select class="input" id="threshold">
          <option value="0">すべてのレース</option>
          <option value="40" selected>兆候あり（B以上）</option>
          <option value="55">有力（A以上）</option>
          <option value="70">濃厚（S）</option>
        </select>
      </span>
      <span class="section-head__tail">
        <a class="btn btn--sm btn--navy" id="raceLink" href="race.html">出走表を見る</a>
      </span>
    </div>
    <div class="chips" id="dayChips"></div>
  </div>
</div>

<main class="wrap wrap--wide" style="padding-top:14px;">
  <div id="loadState" class="state">読み込み中…</div>
  <div id="content" hidden></div>
</main>

<div id="siteFooter"></div>

<script src="assets/keirin-ui.js"></script>
<script>
(function () {
  'use strict';

  const esc = KUI.esc;
  const state = { date: '', days: [], dayIndex: 0, threshold: 40 };

  const el = {
    dateInput: document.getElementById('dateInput'),
    dateLabel: document.getElementById('dateLabel'),
    prevDay:   document.getElementById('prevDay'),
    nextDay:   document.getElementById('nextDay'),
    dayChips:  document.getElementById('dayChips'),
    threshold: document.getElementById('threshold'),
    heroMeta:  document.getElementById('heroMeta'),
    loadState: document.getElementById('loadState'),
    content:   document.getElementById('content'),
    raceLink:  document.getElementById('raceLink')
  };

  const currentDay = () => state.days[state.dayIndex];

  /* =========================================================
     飛びつき判定

     飛びつき = 自分のラインを持たない選手が、他ラインの番手
     （先頭の直後）に飛びついてその位置を奪う戦法。

     飛びつく側（候補）: 単騎の選手。
       自力で駆けられない追込型ほど、どこかの車輪に付かなければ
       勝負にならないため、飛びつく動機が強い。
     飛びつかれる側（標的）: 各ラインの番手。
       前を任せられる先頭が強いほど付く価値が高く、
       今そこにいる番手が候補より弱いほど奪われやすい。
       3番手が控えていない短いラインほど、抵抗が薄く動きやすい。

     ※重み付けは経験則。実戦の感覚に合わせてここだけ調整すればよい。
     ========================================================= */
  const W = {
    need:    { sashi: 1.00, jizai: 0.62, nige: 0.22, other: 0.5 },
    attract: 0.40,   // 先頭の強さ ＝ 付く価値
    vuln:    0.38,   // 番手との地力差 ＝ 奪いやすさ
    loose:   0.22    // ラインの短さ ＝ 動きやすさ
  };

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

  /* 並び文字列 "1-2-3 4-5 6" → [[1,2,3],[4,5],[6]] */
  function parseLines(lines) {
    return String(lines || '').trim()
      .split(/[・\s]+/).filter(Boolean)
      .map(g => g.split('').filter(c => /[1-9]/.test(c)).map(Number))
      .filter(g => g.length);
  }

  function legKind(leg) {
    const v = String(leg || '').trim();
    if (v.indexOf('追') === 0 || v.indexOf('差') === 0 || v.indexOf('マ') === 0) return 'sashi';
    if (v.indexOf('両') === 0 || v.indexOf('自') === 0) return 'jizai';
    if (v.indexOf('逃') === 0) return 'nige';
    return 'other';
  }

  const LEG_LABEL = { sashi: '追込型', jizai: '自在型', nige: '逃げ型', other: '' };

  /* 競走得点を 0..1 に正規化（おおむね90〜115点の幅を想定） */
  const normPoint = pt => clamp((num(pt) - 90) / 25, 0, 1);

  function analyzeRace(race) {
    const groups = parseLines(race.lines);
    const byCar = new Map();
    (race.racers || []).forEach(r => byCar.set(Number(r['車番']), r));

    const solos = groups.filter(g => g.length === 1).map(g => g[0]);
    const lines = groups.filter(g => g.length >= 2);

    const pairs = [];
    solos.forEach(car => {
      const cand = byCar.get(car);
      if (!cand) return;
      const kind = legKind(cand['脚質']);
      const need = W.need[kind];

      lines.forEach(line => {
        const head   = byCar.get(line[0]);
        const target = byCar.get(line[1]);
        if (!head || !target) return;

        const attract = normPoint(head['競走得点']);
        const diff    = num(cand['競走得点']) - num(target['競走得点']);
        const vuln    = clamp(diff / 10 + 0.5, 0, 1);
        const loose   = line.length === 2 ? 1.0 : (line.length === 3 ? 0.6 : 0.35);

        const score = Math.round(
          100 * need * (W.attract * attract + W.vuln * vuln + W.loose * loose)
        );

        pairs.push({ cand, target, head, line, kind, need, diff, score, attract, loose });
      });
    });

    pairs.sort((a, b) => b.score - a.score);
    const best = pairs[0] || null;
    return { groups, solos, pairs, best, score: best ? best.score : 0 };
  }

  function rankOf(score) {
    if (score >= 70) return { key: 's', label: '濃厚' };
    if (score >= 55) return { key: 'a', label: '有力' };
    if (score >= 40) return { key: 'b', label: '兆候' };
    return { key: 'c', label: '薄い' };
  }

  /* =========================================================
     描画
     ========================================================= */
  function whyList(p) {
    const why = [];
    const legLabel = LEG_LABEL[p.kind];

    if (p.kind === 'sashi') {
      why.push(`単騎の<b>追込型</b>。自力で駆けられず、どこかの番手を取らないと勝負にならない`);
    } else if (p.kind === 'jizai') {
      why.push(`単騎の<b>自在型</b>。自力もあるが、展開次第では番手に収まる選択もある`);
    } else if (p.kind === 'nige') {
      why.push(`単騎の<b>逃げ型</b>。自分で駆ける公算が大きく、飛びつきに回る可能性は低め`);
    } else {
      why.push('単騎で、どこかの車輪に付く必要がある');
    }

    why.push(`先頭 ${p.line[0]}番 の競走得点 <b>${esc(p.head['競走得点'])}</b>`
      + (p.attract >= 0.6 ? ' と高く、付いて回る価値が大きい' : ' で、連結妙味はほどほど'));

    const d = p.diff.toFixed(1);
    if (p.diff > 0) {
      why.push(`現番手 ${p.line[1]}番 との得点差 <b>+${esc(d)}</b>。地力で上回り、奪いにいきやすい`);
    } else {
      why.push(`現番手 ${p.line[1]}番 との得点差 <b>${esc(d)}</b>。相手が上位で、単純には収まりにくい`);
    }

    why.push(p.line.length === 2
      ? `${p.line.length}車ラインで後ろに支えがなく、番手が浮きやすい`
      : `${p.line.length}車ラインで、後ろが締めていれば抵抗を受ける`);

    return `<ul class="tb-why">${why.map(w => `<li>${w}</li>`).join('')}</ul>`;
  }

  function lineGroupHtml(group, targetCar) {
    return `<span class="tb-move__grp">${group.map(c =>
      `<span class="${c === targetCar ? 'tb-target' : ''}">${KUI.bikeBadge(c)}</span>`
    ).join('')}</span>`;
  }

  function raceCard(day, race, a) {
    const rank = rankOf(a.score);
    const p = a.best;

    const body = p ? `
      <div class="tb-move">
        <span class="tb-move__label">飛びつき</span>
        <span class="tb-move__who">
          ${KUI.bikeBadge(p.cand['車番'], 'lg')}
          <span>${esc(p.cand['選手名'])}</span>
          <span class="leg leg--${p.kind === 'sashi' ? 'sashi' : (p.kind === 'nige' ? 'nige' : 'makuri')}">${esc(p.cand['脚質'])}</span>
          <span class="muted small">単騎</span>
        </span>
        <span class="tb-move__arrow">▶</span>
        <span class="tb-move__who">
          ${lineGroupHtml(p.line, p.line[1])}
          <span class="muted small">の番手</span>
          <span>${esc(p.target['選手名'])}</span>
        </span>
      </div>
      ${whyList(p)}`
      : `<div class="tb-none">単騎の選手がいないため、飛びつきの候補なし</div>`;

    return `
      <div class="card" style="margin-bottom:14px;">
        <div class="card__head">
          <span class="badge badge--navy">${esc(race.race_num)}R</span>
          <h2 class="card__title">${esc(race.race_name)}</h2>
          <span class="section-head__tail">
            <span class="tb-rank tb-rank--${rank.key}">${rank.label} <b>${a.score}</b></span>
          </span>
        </div>
        <div style="padding:12px;">
          <div class="lines" style="margin-bottom:10px;">
            <span class="muted small">並び</span>${KUI.linesHtml(race.lines)}
          </div>
          ${body}
          <div style="margin-top:10px;">
            <a class="btn btn--sm" href="race.html?date=${state.date}&place=${encodeURIComponent(day.place)}">
              ${esc(race.race_num)}R の出走表 ›
            </a>
          </div>
        </div>
      </div>`;
  }

  function render() {
    const day = currentDay();
    if (!day) return;

    renderDayChips();
    el.raceLink.href = `race.html?date=${state.date}&place=${encodeURIComponent(day.place)}`;

    const analyzed = day.races
      .map(race => ({ race, a: analyzeRace(race) }))
      .sort((x, y) => y.a.score - x.a.score);

    const hit = analyzed.filter(x => x.a.score >= state.threshold);
    const strong = analyzed.filter(x => x.a.score >= 55).length;

    el.heroMeta.innerHTML = `
      <span class="ch-stat">${esc(day.place)} ${esc(day.race_day)}日目</span>
      <span class="ch-stat">全 <b>${day.races.length}</b> R</span>
      <span class="ch-stat">兆候あり <b>${analyzed.filter(x => x.a.score >= 40).length}</b> R</span>
      <span class="ch-stat">有力以上 <b>${strong}</b> R</span>`;

    el.content.innerHTML = `
      <div class="day-summary" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;
           padding:10px 12px;background:var(--panel);border:1px solid var(--line);
           border-left:4px solid var(--red);border-radius:var(--radius);
           box-shadow:var(--shadow);margin-bottom:14px;">
        ${KUI.gradeBadge(day.grade)}
        <span style="font-size:18px;font-weight:800;">${esc(day.place)}競輪</span>
        <span class="badge badge--navy">${esc(day.race_day)}日目</span>
        <span class="badge">表示 ${hit.length} / ${day.races.length}R</span>
      </div>
      ${hit.length
        ? hit.map(x => raceCard(day, x.race, x.a)).join('')
        : `<div class="state">この条件に当てはまるレースはありません</div>`}`;
  }

  function renderDayChips() {
    el.dayChips.innerHTML = state.days.map((d, i) => `
      <button class="chip${i === state.dayIndex ? ' is-active' : ''}" data-day="${i}" type="button">
        ${KUI.gradeBadge(d.grade)}
        <span>${esc(d.place)}</span>
        <span class="chip__sub">${esc(d.race_day)}日目</span>
      </button>`).join('');
  }

  /* =========================================================
     読み込み
     ========================================================= */
  async function load(dateStr, preferPlace) {
    state.date = dateStr;
    el.dateInput.value = dateStr;
    el.dateLabel.textContent = KUI.labelDate(dateStr);
    el.content.hidden = true;
    el.loadState.hidden = false;
    el.loadState.className = 'state';
    el.loadState.textContent = '読み込み中…';
    el.dayChips.innerHTML = '';
    el.heroMeta.innerHTML = '';

    try {
      const days = await KUI.fetchRaceInfo(dateStr);
      if (!Array.isArray(days) || !days.length) throw new Error('empty');

      state.days = days;
      state.dayIndex = 0;
      if (preferPlace) {
        const i = days.findIndex(d => d.place === preferPlace);
        if (i >= 0) state.dayIndex = i;
      }
      el.loadState.hidden = true;
      el.content.hidden = false;
      render();
    } catch (e) {
      state.days = [];
      el.content.hidden = true;
      el.loadState.hidden = false;
      el.loadState.className = 'state state--error';
      el.loadState.textContent = `${KUI.labelDate(dateStr)}の出走表データが見つかりませんでした`;
    }
  }

  /* =========================================================
     イベント
     ========================================================= */
  el.dateInput.addEventListener('change', e => load(e.target.value));
  el.prevDay.addEventListener('click', () => load(KUI.shiftDate(state.date, -1)));
  el.nextDay.addEventListener('click', () => load(KUI.shiftDate(state.date, 1)));

  el.threshold.addEventListener('change', e => {
    state.threshold = Number(e.target.value);
    if (state.days.length) render();
  });

  el.dayChips.addEventListener('click', e => {
    const btn = e.target.closest('[data-day]');
    if (!btn) return;
    state.dayIndex = Number(btn.dataset.day);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* =========================================================
     初期化（JST 22時で翌日へ切り替え）
     ========================================================= */
  function defaultDate() {
    const now = new Date();
    const base = new Date(now);
    if (now.getHours() >= 22) base.setDate(base.getDate() + 1);
    return KUI.ymd(base);
  }

  KUI.mountChrome('channel.html');
  state.threshold = Number(el.threshold.value);

  const params = new URLSearchParams(location.search);
  load(params.get('date') || defaultDate(), params.get('place'));
})();
</script>
</body>
</html>
