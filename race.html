<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>レース情報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* border-collapse: collapse は sticky と併用すると
       罫線が列に追従せず、スクロール中の内容が固定列に透けるため separate を使う */
    .race-table { border-collapse: separate; border-spacing: 0; }
    .race-table th,
    .race-table td { border-right: 1px solid #d1d5db; border-bottom: 1px solid #d1d5db; }
    .race-table thead th { border-top: 1px solid #d1d5db; }
    .race-table th:first-child,
    .race-table td:first-child { border-left: 1px solid #d1d5db; }

    /* 横スクロール時に左端で固定する列。
       col-name の left は col-car の実幅と一致させる必要があるため、
       両方 min/max-width で固定している */
    .col-car  { position: sticky; left: 0;      min-width: 2.4rem; max-width: 2.4rem; z-index: 10; }
    .col-name { position: sticky; left: 2.4rem; min-width: 7.5rem; max-width: 7.5rem; z-index: 10; }
    thead .col-car, thead .col-name { z-index: 20; }

    /* 固定列と横スクロール領域の境目 */
    .col-name::after {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0;
      width: 4px; box-shadow: inset 6px 0 6px -6px rgba(0,0,0,.35);
      transform: translateX(100%); pointer-events: none;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-6xl mx-auto p-3 sm:p-4">

    <!-- 表示切替（プレビュー用） -->
    <div class="mb-3">
      <div id="memberToggle" class="inline-flex rounded-lg border border-gray-300 overflow-hidden text-xs font-medium">
        <button type="button" data-member="0" class="px-3 py-1.5">ログイン前</button>
        <button type="button" data-member="1" class="px-3 py-1.5 border-l border-gray-300">ログイン後</button>
      </div>
    </div>

    <h1 class="text-xl sm:text-2xl font-bold mb-3">レース情報</h1>

    <!-- 日付・開催選択 -->
    <div class="mb-4 flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
      <div class="flex items-center gap-2">
        <label for="dateInput" class="text-sm text-gray-600 shrink-0">日付：</label>
        <input id="dateInput" type="date" class="border rounded px-2 py-1 flex-1 sm:flex-none" />
      </div>
      <div class="flex items-center gap-2 sm:ml-2">
        <label for="daySelect" class="text-sm text-gray-600 shrink-0">開催：</label>
        <select id="daySelect" class="border rounded px-2 py-1 flex-1 sm:flex-none max-w-full"></select>
      </div>
    </div>

    <!-- 会員限定バナー（ログイン前のみ表示） -->
    <div id="lockBanner" class="hidden mb-4 rounded-lg border border-amber-300 bg-amber-50 p-3 sm:p-4">
      <p class="text-sm font-bold text-amber-900 mb-1">🔒 脚評価・評価コメントは会員限定です</p>
      <p class="text-xs text-amber-800 leading-relaxed">
        出走表・成績データは無料でご覧いただけます。独自の脚評価と評価コメントは会員登録後に表示されます。
      </p>
    </div>

    <!-- content -->
    <div id="content" class="space-y-4 sm:space-y-6"></div>
  </div>

  <script>
    const dateInput = document.getElementById('dateInput');
    const daySelect = document.getElementById('daySelect');
    const content = document.getElementById('content');
    const lockBanner = document.getElementById('lockBanner');
    const memberToggle = document.getElementById('memberToggle');

    let raceData = [];

    // ================================
    // GETパラメータ取得
    // ================================
    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        date: params.get('date'),
        place: params.get('place'),
        preview: params.get('preview')
      };
    }

    const { date: queryDate, place: queryPlace, preview } = getQueryParams();

    // ================================
    // 会員判定（暫定）
    //
    // 注意: これは表示確認用の暫定実装であり、認証ではない。
    // 静的サイトである以上クライアント側の判定は誰でも書き換えられる。
    // 本番の出し分けはPhase 2でサーバー側に実装し、
    // 非会員には評価データ自体を配信しない方式に置き換える。
    // ================================
    const MEMBER_KEY = 'asilog:member';
    let isMember = preview === 'member' || localStorage.getItem(MEMBER_KEY) === '1';

    function applyMemberState() {
      lockBanner.classList.toggle('hidden', isMember);

      memberToggle.querySelectorAll('button').forEach(btn => {
        const active = (btn.dataset.member === '1') === isMember;
        btn.className = btn.className
          .replace(/\s*bg-gray-900|\s*text-white|\s*bg-white|\s*text-gray-600/g, '');
        btn.className += active ? ' bg-gray-900 text-white' : ' bg-white text-gray-600';
      });

      if (raceData.length) renderByIndex(Number(daySelect.value) || 0);
    }

    memberToggle.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      isMember = btn.dataset.member === '1';
      localStorage.setItem(MEMBER_KEY, isMember ? '1' : '0');
      applyMemberState();
    });

    // ================================
    // 日付初期化（GET優先 / JST 22時切り替え）
    // ================================

    const now = new Date();

    const baseDate = new Date(now);
    if (now.getHours() >= 22) {
      baseDate.setDate(baseDate.getDate() + 1);
    }

    // YYYY-MM-DD 形式
    const baseDateStr = baseDate.toLocaleDateString('sv-SE');

    // GET パラメータがあればそれを優先
    dateInput.value = queryDate ?? baseDateStr;

    dateInput.addEventListener('change', e => {
      loadByDate(e.target.value);
    });

    // ================================
    // データ読み込み
    // ================================
    async function loadByDate(dateStr) {
      const filename = `race_info_${dateStr.replace(/-/g, '')}.json`;

      content.innerHTML = '読み込み中...';
      daySelect.innerHTML = '';

      try {
        const res = await fetch(`https://storage.googleapis.com/asilogkeirin/race_info/${filename}`);
        if (!res.ok) throw new Error('file not found');

        raceData = await res.json();

        renderDaySelect();

        // place パラメータがあれば該当開催を選択
        let index = 0;
        if (queryPlace) {
          const found = raceData.findIndex(d => d.place === queryPlace);
          if (found >= 0) index = found;
        }

        daySelect.value = index;
        renderByIndex(index);

      } catch (e) {
        content.innerHTML = 'データを読み込めませんでした';
      }
    }

    // ================================
    // 開催 select 描画
    // ================================
    function renderDaySelect() {
      daySelect.innerHTML = '';

      raceData.forEach((day, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${day.place} / ${day.grade} / ${day.race_day}日目`;
        daySelect.appendChild(opt);
      });

      daySelect.onchange = e => {
        renderByIndex(Number(e.target.value));
      };
    }

    // ================================
    // 過去評価取得
    // ================================
    function loadPastEvaluation(day, racerName) {
      if (day.race_day <= 1) return '';

      const key = `eval:${day.race_id}:${racerName}`;
      const raw = localStorage.getItem(key);
      if (!raw) return '';

      const ev = JSON.parse(raw);
      return ev.value || '';
    }

    // ================================
    // 前日コメント取得（単数）
    // ================================
    function loadPastComment(day, racerName) {
      if (day.race_day <= 1) return '';
      const prevIndex = day.race_day - 2;

      const key = `eval:${day.race_id}:${racerName}`;
      const raw = localStorage.getItem(key);
      if (!raw) return '';

      try {
        const data = JSON.parse(raw);
        return data.comments?.[prevIndex] ?? '';
      } catch {
        return '';
      }
    }

    // ================================
    // 会員限定セルの描画
    // ログイン前はダミー文字（■）をぼかして表示し、実データは渡さない。
    // ================================
    function memberCell(value, width = '2.5rem') {
      if (isMember) return value ?? '';
      // role="img" + aria-label で読み上げは「会員限定」になる。
      // sr-only の別要素を置くと絶対配置の基準が横スクロール領域の外側になり、
      // ページ全体に横スクロールが発生するため1要素にまとめている。
      return `<span class="inline-block align-middle blur-[3px] select-none text-gray-400"
                    style="width:${width}" role="img" aria-label="会員限定">■■</span>`;
    }

    // ================================
    // レース描画
    // ================================
    function renderByIndex(index) {
      content.innerHTML = '';

      const target = raceData[index];
      if (!target) return;

      const hasEval = target.race_day >= 2;

      target.races.forEach(race => {
        const raceDiv = document.createElement('div');
        raceDiv.className = 'bg-white rounded shadow p-3 sm:p-4';

        raceDiv.innerHTML = `
          <h2 class="font-bold text-base sm:text-lg mb-1 sm:mb-2">
            ${race.race_num}R ${race.race_name}
          </h2>
          <div class="text-sm text-gray-600 mb-2">
            ライン: ${race.lines}
          </div>
          ${renderTable(target, race, hasEval)}
        `;

        content.appendChild(raceDiv);
      });
    }

    // --------------------------------
    // 出走表テーブル
    // 車番・選手名を左端に固定し、残りの列を横スクロールさせる
    // --------------------------------
    function renderTable(target, race, hasEval) {
      const th = 'px-1 py-1 bg-gray-50 font-medium whitespace-nowrap';
      const td = 'px-1 py-1 whitespace-nowrap';

      return `
        <div class="overflow-x-auto">
          <table class="race-table text-xs sm:text-sm" style="min-width:max-content">
            <thead>
              <tr>
                <th class="${th} col-car text-center">車</th>
                <th class="${th} col-name text-left">選手名</th>
                ${hasEval ? `<th class="${th}">評価</th>` : ''}
                <th class="${th}">競走<br>得点</th>
                <th class="${th}">脚</th>
                <th class="${th}">S</th>
                <th class="${th}">B</th>
                <th class="${th}">逃</th>
                <th class="${th}">捲</th>
                <th class="${th}">差</th>
                <th class="${th}">マ</th>
                <th class="${th}">勝率</th>
                <th class="${th}">2連<br>対率</th>
                <th class="${th}">3連<br>対率</th>
                ${hasEval
                  ? `<th class="${th}">前日<br>順位</th>
                     <th class="${th}">前日<br>上り</th>`
                  : ''
                }
                <th class="${th}">コメント</th>
                ${hasEval ? `<th class="${th}">脚ログ</th>` : ''}
              </tr>
            </thead>
            <tbody>
              ${race.racers.map(r => `
                <tr>
                  <td class="${td} col-car bg-white text-center font-bold">${r.車番}</td>
                  <td class="${td} col-name bg-white">
                    <div class="font-medium leading-tight">${r.選手名}</div>
                    <div class="text-[10px] text-gray-600 leading-tight">
                      ${r.級班} ${r.年齢} ${r.期別} ${r.府県}
                    </div>
                  </td>
                  ${hasEval
                    ? `<td class="${td} text-center font-bold">
                         ${memberCell(loadPastEvaluation(target, r.選手名), '2rem')}
                       </td>`
                    : ''
                  }
                  <td class="${td} text-right">${r.競走得点}</td>
                  <td class="${td} text-center">${r.脚質}</td>
                  <td class="${td} text-center">${r.S}</td>
                  <td class="${td} text-center">${r.B}</td>
                  <td class="${td} text-center">${r.逃}</td>
                  <td class="${td} text-center">${r.捲}</td>
                  <td class="${td} text-center">${r.差}</td>
                  <td class="${td} text-center">${r.マ}</td>
                  <td class="${td} text-right">${r.勝率}</td>
                  <td class="${td} text-right">${r["2連対率"]}</td>
                  <td class="${td} text-right">${r["3連対率"]}</td>
                  ${hasEval
                    ? `<td class="${td} text-center">${r.前日着 ?? ''}</td>
                       <td class="${td} text-center">${r.前日上り ?? ''}</td>`
                    : ''
                  }
                  <td class="px-1 py-1 min-w-[11rem] whitespace-normal leading-snug">
                    ${r.コメント ?? ''}
                  </td>
                  ${hasEval
                    ? `<td class="px-1 py-1 min-w-[8rem] whitespace-normal
                               text-[11px] text-gray-700 leading-snug">
                         ${memberCell(loadPastComment(target, r.選手名), '5rem')}
                       </td>`
                    : ''
                  }
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // ================================
    // 初期ロード
    // ================================
    applyMemberState();
    loadByDate(dateInput.value);
  </script>
</body>
</html>
