<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASILOG KEIRIN | 競輪レース情報</title>
  <meta name="description" content="競輪の出走表・レース結果を掲載しています。" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-3xl mx-auto p-4 py-10">

    <header class="mb-10">
      <h1 class="text-3xl font-bold mb-2">ASILOG KEIRIN</h1>
      <p class="text-gray-600">競輪の出走表・レース結果を掲載しています。</p>
    </header>

    <nav class="grid sm:grid-cols-2 gap-4 mb-10">
      <a href="channel.html"
         class="block sm:col-span-2 bg-white border rounded-lg p-6 hover:border-gray-900 transition">
        <div class="text-2xl mb-2">📺</div>
        <h2 class="font-bold mb-1">飛びつきチャンネル</h2>
        <p class="text-sm text-gray-600">飛びつきが発生しそうなレースと買い目（模範目）を掲載しています。</p>
      </a>

      <a href="race.html"
         class="block bg-white border rounded-lg p-6 hover:border-gray-900 transition">
        <div class="text-2xl mb-2">📋</div>
        <h2 class="font-bold mb-1">レース情報（出走表）</h2>
        <p class="text-sm text-gray-600">本日開催のレース・出走選手を確認できます。</p>
      </a>

      <a href="result.html"
         class="block bg-white border rounded-lg p-6 hover:border-gray-900 transition">
        <div class="text-2xl mb-2">🏁</div>
        <h2 class="font-bold mb-1">レース結果</h2>
        <p class="text-sm text-gray-600">確定した着順・レース映像を確認できます。</p>
      </a>
    </nav>

    <div id="memberBar" class="mb-8 flex items-center gap-3 text-sm"></div>

    <footer class="border-t pt-6 text-sm text-gray-500">
      <a href="company/" class="hover:text-gray-900 underline">運営会社</a>
      <p class="mt-4 text-xs leading-relaxed">
        当サイトは競輪を楽しむための情報提供を目的としています。
        車券の的中を保証するものではありません。車券の購入はご自身の判断と責任において行ってください。
      </p>
    </footer>

  </div>
  <script src="assets/keirin-ui.js"></script>
  <script>
    // ログイン状態の表示と導線。判定は keirin-ui.js の KUI に寄せている
    (function () {
      const bar = document.getElementById('memberBar');

      function paint() {
        bar.innerHTML = KUI.isMember()
          ? `<span class="rounded-full bg-green-100 text-green-800 px-3 py-1 text-xs font-bold">ログイン中</span>
             <span class="text-gray-600">会員限定の脚評価が表示されます。</span>
             <a href="#" id="logout" class="ml-auto underline hover:text-gray-900">ログアウト</a>`
          : `<a href="${KUI.loginUrl('index.html')}"
                class="rounded-lg bg-gray-900 text-white px-4 py-2 text-sm font-bold hover:bg-gray-700">ログイン</a>
             <span class="text-gray-600">ログインすると脚評価・評価コメントが表示されます。</span>`;
      }

      bar.addEventListener('click', e => {
        if (!e.target.closest('#logout')) return;
        e.preventDefault();
        KUI.setMember(false);
        paint();
      });

      paint();
    })();
  </script>
</body>
</html>
